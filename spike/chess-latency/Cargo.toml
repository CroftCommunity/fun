# Phase 4 latency harness for plans/2026-08-30-plan-chess-vs-engine.md.
#
# NOT a workspace member (the empty [workspace] table detaches it): the
# keep-as-fixture measurement rig. Times chess-solver's search_root per level
# over the D2 position set — natively (the deepen verdict, the level table)
# and built to wasm32-unknown-unknown for Chromium and, later, the phones
# (Phase 13 uses this same harness so its numbers are comparable).
[package]
name = "chess-latency"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chess-core = { path = "../../crates/chess-core" }
chess-solver = { path = "../../crates/chess-solver" }

[profile.release]
opt-level = 3

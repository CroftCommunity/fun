# osv-scanner exceptions — Phase 0 of the supply-chain rollout, 2026-08-29.
#
# Rule and why: CroftC/.claude/SUPPLY-CHAIN.md rule 9 — dated, reasoned, expiring.
# Each reason names the rung of rule 5 that settled it.
#
# What was NOT excepted: every advisory with an in-range fix was FIXED by `npm audit fix`
# in the same pass. Only the vite/vitest/esbuild cluster remains, because each of those
# fixes is a MAJOR bump — vite 5->6, vitest 2->3, esbuild 0.21->0.25.
#
# That is the drift thesis making itself concrete: these are not deferred security fixes,
# they are deferred version bumps that BECAME security fixes. The bumps belong to Phase 4
# (the freshness budget), not to a Phase 0 whose job is to record a baseline. This repo is
# among those already over the FLAG threshold in .claude/DEP-DRIFT.md.
#
# Verified for THIS repo before writing any of it (rule 5, rungs 3 and 4):
#   - the test script is `vitest run` — headless. No Vitest UI, no Browser Mode.
#   - no `--host`, no `--api.host`, no `api.host` config anywhere. The dev server is
#     never exposed to a network.
#   - CI and every developer machine here are Linux/macOS. Two of these advisories are
#     Windows-only by their own text.
# All three conditions must hold. If any changes, these exceptions are void — see each
# entry.

[[IgnoredVulns]]
id = "GHSA-5xrq-8626-4rwp"
ignoreUntil = 2026-11-29
reason = """vitest 2.1.9 — arbitrary file read via the Vitest UI server (CVSS 9.8, and
the score is doing a lot of work here). By the advisory's own text it affects only users
who EXPLICITLY expose the Vitest UI server (--api.host / api.host) or who run Vitest UI
or Browser Mode ON WINDOWS. This repo runs `vitest run` headless, exposes nothing, and
runs on Linux/macOS. Rungs 3 and 4 both clear it independently.
VOID IF: the UI or Browser Mode is adopted, --api.host is added, or a Windows runner
enters CI. Fix is vitest 3.2.6, a major bump — Phase 4."""


# fun — the Croft games pond (fun.croft.ing). A determinism-first game shelf.
#
# Per the per-pond build discipline (discovery/beta/croft/build-order-and-ponds-roadmap.md)
# and the plans under plans/: determinism-first, red-first. Versions are pinned
# exactly (`=x.y.z`) and Cargo.lock is committed, matching alpha/Proofs/lineage-groups.
#
# Members: per-game deterministic cores (trio-tumble-core promoted from the discovery
# spike; solitaire-core is the first new game) + their wasm browser bindings +
# shared substrate crates (pond-docformat = P2 version policy, pond-outcome = P8
# verifiable outcomes). Substrate + solitaire crates start as compiling
# empty-but-real stubs (master-plan Phase 1), filled in their named phases.
[workspace]
resolver = "2"
members = [
    "crates/align-core",
    "crates/align-wasm",
    "crates/blockdoku-core",
    "crates/blockdoku-wasm",
    "crates/bubble-core",
    "crates/looseends-core",
    "crates/looseends-wasm",
    "crates/mahjong-core",
    "crates/mahjong-solver",
    "crates/mahjong-wasm",
    "crates/color-sort-core",
    "crates/color-sort-solver",
    "crates/color-sort-wasm",
    "crates/wyrdle-core",
    "crates/twenty48-core",
    "crates/twenty48-wasm",
    "crates/wyrdle-wasm",
    "crates/bubble-solver",
    "crates/bubble-wasm",
    "crates/trio-tumble-core",
    "crates/solitaire-core",
    "crates/pond-docformat",
    "crates/pond-physics",
    "crates/orchard-core",
    "crates/orchard-wasm",
    "crates/pond-outcome",
    "crates/trio-tumble-wasm",
    "crates/solitaire-wasm",
    "crates/solitaire-solver",
    "crates/trio-tumble-solver",
    "crates/adversary-core",
    "crates/adversary-solver",
    "crates/dots-core",
    "crates/dots-solver",
    "crates/dots-wasm",
    "crates/drop4-core",
    "crates/drop4-solver",
    "crates/drop4-harness",
    "crates/drop4-wasm",
    "crates/checkers-core",
    "crates/chess-core",
    "crates/chess-solver",
    "crates/chess-wasm",
    "crates/cribbage-core",
    "crates/cribbage-solver",
    "crates/cribbage-wasm",
    "crates/checkers-solver",
    "crates/checkers-wasm",
    "crates/furrow-core",
    "crates/furrow-solver",
    "crates/furrow-wasm",
    "crates/othello-core",
    "crates/othello-solver",
    "crates/othello-wasm",
    "crates/xbuild",
]

[workspace.package]
edition = "2021"
version = "0.0.0"
publish = false
license = "AGPL-3.0-only"

[workspace.dependencies]
# Determinism: seeded ChaCha20, same primitive lineage-core uses. default-features
# off drops `std`/`getrandom` (we only ever seed_from_u64) so the cores cross-compile
# to wasm32-unknown-unknown, which has no OS entropy backend for getrandom.
rand = { version = "=0.8.6", default-features = false }
rand_chacha = { version = "=0.3.1", default-features = false }

# Serialization (golden vectors, board state, documents) + hashing (state hash).
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
hex = "=0.4.3"
thiserror = "=2.0.18"

# internal crates
align-core = { path = "crates/align-core" }
blockdoku-core = { path = "crates/blockdoku-core" }
bubble-core = { path = "crates/bubble-core" }
looseends-core = { path = "crates/looseends-core" }
mahjong-core = { path = "crates/mahjong-core" }
mahjong-solver = { path = "crates/mahjong-solver" }
color-sort-core = { path = "crates/color-sort-core" }
color-sort-solver = { path = "crates/color-sort-solver" }
wyrdle-core = { path = "crates/wyrdle-core" }
trio-tumble-core = { path = "crates/trio-tumble-core" }
solitaire-core = { path = "crates/solitaire-core" }
pond-docformat = { path = "crates/pond-docformat" }
pond-outcome = { path = "crates/pond-outcome" }
pond-physics = { path = "crates/pond-physics" }
orchard-core = { path = "crates/orchard-core" }
checkers-core = { path = "crates/checkers-core" }
adversary-solver = { path = "crates/adversary-solver" }
checkers-solver = { path = "crates/checkers-solver" }

# Lint policy for crates that opt in with `[lints] workspace = true`.
#
# Default-level clippy is enforced workspace-wide in CI (`-D warnings`); this
# table is the *additional* pedantic tier, adopted per-crate rather than
# globally. Measured 2026-08-04: pedantic across the existing 33 crates is ~190
# warnings, and 154 of them (81%) are the cast family below — firing on exactly
# the deliberate `usize`->`u32` narrowing the determinism discipline requires at
# RNG/hash boundaries so `native == wasm` (see CLAUDE.md). Allowing those four
# here beats decorating the repo's most correctness-critical code with 154
# scattered `#[allow]`s, and keeps the ~36 pedantic lints that do earn their
# keep (missing_panics_doc, doc_markdown, match_same_arms, ...).
#
# New crates opt in. Existing crates are grandfathered, not exempted forever.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

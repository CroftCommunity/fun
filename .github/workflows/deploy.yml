name: Deploy fun.croft.ing

# Build the static shelf (Rust -> wasm, then esbuild) and publish dist/ to
# GitHub Pages. The wasm must be built first — /solitaire.wasm and
# /daily-pack.json are fetched at runtime, and build.mjs only copies the wasm
# once the artifact exists (same order the Playwright webServer uses locally).

on:
  push:
    branches: [main]
  # Without this, every check below runs only AFTER a commit lands on main —
  # it protects the deploy but not the branch, and a PR reports
  # `mergeable: MERGEABLE, checks: 0` because nothing ran.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time PER REF; a newer push to the same ref supersedes an
# in-flight run. Keyed by ref (not a single global group) so a PR run can never
# cancel an in-flight production deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # We do not run Playwright here, so skip the browser download.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # rust-toolchain.toml is the single source of truth for the pinned version;
      # read it rather than duplicating a number here that could drift from it.
      - id: rust
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Build the wasm binding first — the unit suite's verify-orchestration
      # tests load the real solitaire_wasm.wasm, so it must exist before `unit`.
      - run: npm run build:wasm
      # Cheap correctness gate before publishing.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run unit
      # Static site (build.mjs copies the wasm + daily-pack.json + CNAME into dist/).
      - run: node build.mjs
      # Publishing plumbing only — skipped on PRs, where there is nothing to
      # publish and fork tokens are read-only. The gate above still runs.
      #
      # The condition is "not a PR", NOT "is a push". It used to be the latter,
      # which silently broke `workflow_dispatch`: the upload was skipped while the
      # `deploy` job below (guarded only on the ref) ran anyway and failed with
      # "No artifacts named github-pages were found". Manual dispatch is the only
      # way to publish when webhook deliveries are throttled — which is exactly
      # when it is needed — so the two guards have to agree about what a
      # publishable run is. Found 2026-08-06 during the Actions outage.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # The Rust gate. `build` only proves the 11 wasm crates *compile* for
  # wasm32 — not that any test passes, not that lints are clean, and not that
  # host-only crates (e.g. drop4-harness) build at all. Runs in parallel with
  # `build`: they share no outputs, so wall clock is the max of the two.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # Pinned via rust-toolchain.toml, not `@stable`. A floating toolchain can
      # turn `main` red on code nobody touched, and it let local clippy 0.1.94
      # disagree with CI's 0.1.97 three round trips running during bring-up.
      - id: rust
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          # Requested explicitly rather than relying on the action's default
          # profile — a missing component is a cheap fix and an expensive round trip.
          components: clippy, rustfmt
      # Without this, every run recompiles 33 crates from scratch. A gate slow
      # enough to resent is a gate that eventually gets deleted.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
      # On the record: local and CI clippy disagreed during this gate's
      # bring-up (2026-08-04), so the versions are printed every run.
      - run: rustc --version && cargo clippy --version && cargo fmt --version
      # The same command README.md's Build section already documents.
      - run: cargo fmt --all --check
      # --release is load-bearing, not an optimization. Measured 2026-08-04:
      # the debug profile ran >20 min and was killed, dominated entirely by
      # bubble-solver's committed_pack_seeds_are_winnable_spotcheck (three full
      # find_win searches); release runs the whole workspace in ~53s. Do not
      # drop --release to "speed up the build" — it does the opposite.
      - run: cargo test --workspace --release
      # --all-targets is load-bearing: the workspace's only pre-existing clippy
      # warning lived in a *lib test*, so a plain `cargo clippy` reported clean
      # and would have gated nothing in test code — which is where this repo's
      # fixtures and soaks live.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The cross-build determinism check: replay the golden scenarios inside
      # wasm32 and assert the hashes equal the natively-recorded ones.
      #
      # It needs a NODE step after a wasm build, which is why it never fitted a
      # Rust-only job and why — until 2026-08-29 — it ran nowhere at all. The
      # harness existed, was documented, and was executed by nothing: no npm
      # script, no CI reference. `native == wasm` is a claim this shelf makes to
      # users, and it was resting on a script someone had to remember to run.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version-file: .nvmrc
      - run: rustup target add wasm32-unknown-unknown
      - run: npm run test:xbuild

  # The wasm modules, built ONCE for the browser shards (2026-08-29). Before this
  # job every e2e job rebuilt every crate's wasm inside Playwright's webServer —
  # one to two minutes of a cold runner's time per job, before a single test ran.
  # With the suite sharded that fixed cost would be paid per shard; building here
  # and handing the artifact down is what makes shards halve the wall clock
  # instead of merely spreading it (plans/2026-08-29-plan-e2e-shards-and-smoke.md, D1).
  #
  # `build` still builds its own: its unit tests load the real wasm and it
  # produces the deployable dist/, and coupling it to this job would gain a
  # minute at the cost of making the longest job wait on another.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - id: rust
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
      - run: npm run build:wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wasm-modules
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
          retention-days: 1

  # The browser gate. It exists because `npm run unit` cannot see a board: every
  # game's wiring test ("built means wired"), every axe check in every skin, and
  # every `?r=` share round-trip lives here.
  #
  # ONE JOB PER PLAYWRIGHT PROJECT, not one job for both (2026-08-29). Two
  # reasons, in order of what actually drove it:
  #
  #   1. Attribution. Every e2e failure on main since 2026-08-27 has been a
  #      30s timeout in `mobile-webkit`, and a different test each run — dots,
  #      then a11y-matrix + othello, then dots + furrow. With both engines in one
  #      job, "e2e failed" says nothing about WHICH engine, the logs interleave,
  #      and one report artifact holds both. Split, the failing engine is the job
  #      name, and `fail-fast: false` means the healthy engine still reports
  #      instead of being cancelled with it.
  #   2. Headroom. Each project now gets a whole runner for half the tests.
  #      A GitHub runner gives Playwright 2 workers where a laptop gives 7, and
  #      the suite has grown past the 4.5 min this file used to claim — green
  #      runs were taking 6.5-7.5 min and the mobile tests were brushing the 30s
  #      per-test ceiling. Halving the per-runner load is the fix that does not
  #      involve raising the ceiling and calling it fixed.
  #
  # This costs a second runner for e2e. That is the trade: e2e was already the
  # critical path, so the wall clock should improve even as total minutes rise.
  #
  # DO NOT CONSOLIDATE THESE BACK INTO ONE JOB FOR SPEED. The split is not only
  # tidier reporting — it is what made two DIFFERENT failures distinguishable, and
  # they had been wearing one symptom for days. Both showed up as "e2e failed, some
  # mobile-webkit test timed out at 30s", and they needed opposite fixes:
  #
  #   dots.spec.ts:191        0.36s locally, 30s on CI. A HANG. An async WebGPU probe
  #                           re-rendered mid-interaction and container.replaceChildren
  #                           rebuilt the open settings panel closed, so the checkbox
  #                           was detached and its replacement invisible. Fixed in the
  #                           app (src/ui-state.ts), not here.
  #   a11y-matrix.spec.ts:76  9.1s locally, past 30s on CI. GENUINELY LONG — every game
  #                           scanned inside one budget. Fixed by regrouping per game.
  #
  # The obvious cheap remedy was to raise the per-test timeout. It would have fixed the
  # long one and BURIED THE HANG behind a green tick — a real UI bug, shipped, with the
  # suite reporting success. A remedy aimed at the symptom turns a loud failure into a
  # quiet one. Rejoining the jobs re-merges the evidence that told them apart.
  # SHARDED, three per engine (2026-08-29). The per-engine split above bought
  # headroom and the headroom was spent: the landing after it (run 33263190505)
  # failed two unrelated cheap tests on `page.goto` timeouts — the mobile leg
  # starving, not either test being wrong. Measured on the last green run: the
  # mobile-webkit job was 279s of tests on 2 workers after ~3 min of fixed cost.
  # Playwright's --shard splits the test list by count; the shards' test time
  # was measured before choosing three (the plan's Phase 1: 79s / 54s / 34s on
  # the slow engine at 7 local workers — lopsided toward the a11y matrix and
  # checkers, every shard well under the old single leg).
  #
  # The wasm comes from the `wasm` job above, so a shard's fixed cost is the
  # checkout and the browser, not a Rust build. E2E_PREBUILT_WASM tells the
  # Playwright webServer to skip `build:wasm`, and build.mjs treats a missing
  # module as an ERROR under CI (locally it is a note) — a shard that lost its
  # artifact must go red, not serve a shelf with no engines and pass what it
  # could.
  #
  # DO NOT raise the per-test timeout to buy back what sharding buys. The
  # comment block above records why: it buried a real hang once already.
  e2e:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/3)
    needs: [wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A mobile-webkit failure must not cancel chromium — knowing whether the
      # OTHER engine was fine is most of the diagnostic value of splitting.
      fail-fast: false
      matrix:
        project: [chromium, mobile-webkit]
        shard: [1, 2, 3]
        include:
          - project: chromium
            browser: chromium
          - project: mobile-webkit
            browser: webkit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: wasm-modules
          path: target/wasm32-unknown-unknown/release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Install deps WITHOUT the browser download, then restore the browsers from
      # cache — otherwise every run re-downloads ~300MB that changes only when
      # Playwright's version does.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      # `--with-deps` installs the system libraries too; a cache hit still needs
      # it (the libs are not in the cached directory, and the runner is fresh
      # every run), but it is seconds.
      #
      # Retried, because that apt step is the one part of this gate that depends
      # on a third party staying up. Run 31211892961 (2026-08-07) stalled 4.5
      # minutes mid-download on `libflite1` from azure.archive.ubuntu.com and took
      # the job's 30-minute timeout with it — reddening a run whose `rust` and
      # `build` jobs had already passed. Nothing in the diff went near it.
      #
      # `timeout 300` is what makes this work: the failure mode is a *stall*, not
      # an error, so a bare retry loop would sit in the same hung download until
      # the job timeout. Bound each attempt, then retry.
      - name: Install Playwright browsers + system deps (retried)
        run: |
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps ${{ matrix.browser }}; then
              exit 0
            fi
            echo "::warning::playwright install attempt $attempt failed or stalled; retrying"
            sleep 10
          done
          echo "::error::playwright install failed three times — suspect an apt/CDN outage, not this commit"
          exit 1
      - run: npm run e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3
        env:
          E2E_PREBUILT_WASM: "1"
      # A failed browser test is unreadable without its trace/screenshots.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  deploy:
    # A Rust regression blocks publication, not just annotates it.
    needs: [build, rust, e2e]
    # `workflow_dispatch` can be aimed at any ref; without this guard, dispatching
    # against a scratch branch would publish that branch to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

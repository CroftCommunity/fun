[package]
name = "twenty48-core"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
description = "Deterministic, headless 2048 engine. 4x4 exponent-encoded tiles, seeded ChaCha20 spawns, slide/merge in four directions, score, win (2048) / stuck, state hash. Directional moves, so replay from (seed, directions) is exact and native==wasm. No network."


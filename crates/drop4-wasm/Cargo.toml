[package]
name = "drop4-wasm"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
description = "Browser binding over drop4-core + drop4-solver for the shelf: raw C-ABI + serde-JSON (no wasm-bindgen). Holds one Drop 4 game, exposes rules (legal/play/board/hash/result/render), the exact Oracle (best move at a difficulty Level, and per-move values for a hybrid difficulty band), and the verifiable outcome. Never panics."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adversary-core = { path = "../adversary-core" }
drop4-core = { path = "../drop4-core" }
drop4-solver = { path = "../drop4-solver" }
pond-outcome = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
rand_chacha.workspace = true

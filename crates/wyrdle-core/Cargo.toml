[package]
name = "wyrdle-core"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
description = "Deterministic, headless daily word-guessing engine (Wordle-family). Per-letter correct/present/absent scoring with standard duplicate handling, embedded license-clean word lists, seed->answer map, state hash. No RNG on the runtime path, so replay is exact and native==wasm. No network."

[dependencies]
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
pond-outcome.workspace = true
pond-docformat.workspace = true

[package]
name = "twenty48-wasm"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
description = "Browser binding over twenty48-core for the shelf: raw C-ABI + serde-JSON (no wasm-bindgen). Holds one 2048 game, typed directional move export, board/hash/outcome JSON via an output buffer, embedded daily seed-pack. Never panics."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
twenty48-core = { path = "../twenty48-core" }
pond-outcome = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true

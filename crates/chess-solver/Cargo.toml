description = "Chess engine: material + tapered piece-square alpha-beta with quiescence, a sound transposition table and node budgets, the classic opponent (with difficulty levels), and an honest oracle whose `exact` flag means a PROVEN terminal — a real win/draw/loss reached inside the search — rather than a full solve, which chess never affords. No network, no floats on any compared path (native==wasm move choice)."


[package]
name = "mahjong-core"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
description = "Deterministic, headless engine for Mahjong solitaire (tile matching). 144-tile set with flower/season wild classes, layouts on a half-tile grid, the FREE predicate (nothing on top, a long side open), reverse-construction deals that are winnable by construction, a recorded shuffle that re-deals the remainder the same way, state hash + move-list replay so an outcome is verifiable. Integer-exact so native == wasm. No network."


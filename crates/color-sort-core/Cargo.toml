[package]
name = "color-sort-core"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
description = "Deterministic, headless water/ball/bolt sort-puzzle engine. Tubes of capacity 4 hold colour-id stacks; a pour moves the maximal top-colour run into an empty or matching tube (water-move semantics — one engine for every skin, per Ito et al. arXiv:2202.09495). Seeded ChaCha20 deal, move-list replay, state hash. Native==wasm."


[package]
name = "wyrdle-wasm"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
description = "Browser binding over wyrdle-core for the shelf: raw C-ABI + serde-JSON (no wasm-bindgen). Holds one daily word game, typed guess/is_allowed exports, board/keyboard/hash/outcome JSON via an output buffer, embedded answer daily-pack. Never panics."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wyrdle-core = { workspace = true }
pond-outcome = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true

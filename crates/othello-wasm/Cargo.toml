[package]
name = "othello-wasm"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
description = "Browser binding over othello-core + othello-solver for the shelf: raw C-ABI + serde-JSON (no wasm-bindgen). Holds one Othello game, exposes rules (legal/play/pass/board/hash/result/render), the live opponent (difficulty Levels), the engine-grounded tutor (assess/tutor, exact-in-endgame flag), and the verifiable outcome (passes serialized so ?r= replays exactly). Never panics."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adversary-core = { path = "../adversary-core" }
othello-core = { path = "../othello-core" }
othello-solver = { path = "../othello-solver" }
pond-outcome = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
rand_chacha.workspace = true

[package]
name = "dots-core"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
description = "Deterministic, headless Dots and Boxes engine. 3x3 boxes on a 4x4 dot lattice, draw-an-edge moves, a capture grants another turn, canonical state hash. Implements the shared Adversary trait and pond_outcome::Game, so a two-player match replays from (seed, moves) exactly and native==wasm. No floats on the hashed path, no network."

[lints]
workspace = true

[dependencies]
adversary-core = { path = "../adversary-core" }
serde = { workspace = true }
sha2.workspace = true
hex.workspace = true
pond-outcome.workspace = true

[dev-dependencies]
pond-docformat.workspace = true

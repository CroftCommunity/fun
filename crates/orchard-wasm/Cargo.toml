[package]
name = "orchard-wasm"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
description = "Browser binding over orchard-core for the shelf: raw C-ABI + serde-JSON (no wasm-bindgen). Holds one Orchard Drop run, tick-indexed drop/wait exports, world/hash/outcome JSON via an output buffer, embedded daily seed-pack, and a per-tick digest for bisecting a native-vs-wasm divergence. Never panics."

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
orchard-core = { path = "../orchard-core" }
pond-physics = { workspace = true }
pond-outcome = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true

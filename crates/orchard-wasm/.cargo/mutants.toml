# `src/bin/expected.rs` is a FIXTURE GENERATOR, not production code: it prints
# the native values `check.mjs` and `tests/orchard-wasm.test.ts` compare the wasm
# build against. Mutating it changes what the fixture would say if regenerated,
# which nothing checks, because the committed `expected.json` is what the
# harnesses read.
#
# This exclusion is recorded rather than quiet, because excluding code to improve
# a mutation score is precisely the failure the practice exists to prevent. The
# justification here is that the file is not on any path the game takes; its
# output is committed and verified by two harnesses cargo-mutants cannot run.
exclude_globs = ["crates/orchard-wasm/src/bin/**"]
